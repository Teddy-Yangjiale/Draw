name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo,dev]"

      - name: Unit tests
        run: python -m pytest

      - name: Doctor
        run: pptdraw doctor

      - name: End-to-end demo
        run: |
          pptdraw demo ci-demo.pptx --force
          pptdraw inspect ci-demo.pptx --format outline
          pptdraw lint ci-demo.pptx
